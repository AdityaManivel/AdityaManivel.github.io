<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 870" role="img" aria-labelledby="title desc"><title id="title">Firmware and hardware communication architecture</title><desc id="desc">Camera feeds Linux Cortex-A7; browser exchanges requests and responses with web server; A7 and M4 communicate bidirectionally over OpenAMP RPMsg; M4 and STM32 PCB exchange UART commands and status. STM32 controls two stepper drivers and an RS485 servo transceiver, and receives inputs from four limit switches.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344c62"/></marker><marker id="arrstart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10Z" fill="#344c62"/></marker><style>.heading{font:700 23px Arial,sans-serif;fill:#18283a}.body{font:18px Arial,sans-serif;fill:#263e53}.label{font:17px Arial,sans-serif;fill:#344c62}.small{font:15px Arial,sans-serif;fill:#344c62}</style></defs><rect width="1680" height="870" fill="#fff"/>
<rect x="380" y="24" width="400" height="78" rx="13" fill="#dcf4df" stroke="#2a9c60" stroke-width="2"/><text x="580" y="58" class="heading" text-anchor="middle">USB Camera</text><text x="400" y="88" class="body"></text>
<rect x="320" y="150" width="570" height="590" rx="22" fill="#f2faff" stroke="#1bace8" stroke-width="3" stroke-dasharray="12 8"/><text x="605" y="190" class="heading" text-anchor="middle">Linux Development Board</text>
<rect x="350" y="220" width="510" height="190" rx="13" fill="#d8ebff" stroke="#2582dc" stroke-width="2"/><text x="605" y="254" class="heading" text-anchor="middle">Cortex-A7</text><text x="370" y="284" class="body">Embedded Linux / Python web server</text><text x="370" y="308" class="body">Receives camera frames and web requests</text><text x="370" y="332" class="body">Sends motion commands; receives status</text>
<rect x="350" y="515" width="510" height="180" rx="13" fill="#e9d9ff" stroke="#9952ef" stroke-width="2"/><text x="605" y="549" class="heading" text-anchor="middle">Cortex-M4</text><text x="370" y="579" class="body">Receives commands via OpenAMP / RPMsg</text><text x="370" y="603" class="body">Relays commands to STM32 over UART</text><text x="370" y="627" class="body">Returns status to Cortex-A7</text>
<rect x="25" y="265" width="250" height="135" rx="13" fill="#e0f0ff" stroke="#2582dc" stroke-width="2"/><text x="150" y="299" class="heading" text-anchor="middle">Browser (Web GUI)</text><text x="45" y="329" class="body">Remote laptop / client</text>
<rect x="960" y="280" width="350" height="245" rx="13" fill="#fff0d9" stroke="#b88c44" stroke-width="2"/><text x="1135" y="314" class="heading" text-anchor="middle">STM32 PCB MCU</text><text x="980" y="344" class="body">Motor control (STM32 HAL)</text><text x="980" y="368" class="body">Limit-switch monitoring</text><text x="980" y="392" class="body">UART command processing</text><text x="980" y="416" class="body">Motion and status feedback</text>
<rect x="1395" y="160" width="260" height="95" rx="13" fill="#ffe3e3" stroke="#e75d67" stroke-width="2"/><text x="1525" y="194" class="heading" text-anchor="middle">Stepper Driver X</text><text x="1415" y="224" class="body">STEP / DIR input</text>
<rect x="1395" y="290" width="260" height="95" rx="13" fill="#ffe3e3" stroke="#e75d67" stroke-width="2"/><text x="1525" y="324" class="heading" text-anchor="middle">Stepper Driver Y</text><text x="1415" y="354" class="body">STEP / DIR input</text>
<rect x="1395" y="420" width="260" height="95" rx="13" fill="#ffe3e3" stroke="#e75d67" stroke-width="2"/><text x="1525" y="454" class="heading" text-anchor="middle">RS485 Transceiver</text><text x="1415" y="484" class="body">Servo UART interface</text>
<rect x="980" y="640" width="300" height="140" rx="13" fill="#e0f7ef" stroke="#2caa7c" stroke-width="2"/><text x="1130" y="674" class="heading" text-anchor="middle">4 Limit Switches</text><text x="1000" y="704" class="body">SW1, SW2, SW3, SW4</text><text x="1000" y="728" class="body">Digital inputs to STM32</text>
<path d="M580 102V219" fill="none" stroke="#344c62" stroke-width="2.5" marker-end="url(#arr)" /><path d="M275 325H349" fill="none" stroke="#344c62" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arrstart)"/><text x="291" y="307" class="small">HTTP</text>
<path d="M605 410V514" fill="none" stroke="#344c62" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arrstart)"/><text x="624" y="470" class="label">OpenAMP / RPMsg</text>
<path d="M860 606H920V402H959" fill="none" stroke="#344c62" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arrstart)"/><text x="869" y="590" class="label">UART (TX / RX)</text>
<path d="M1310 325H1350V207H1394" fill="none" stroke="#344c62" stroke-width="2.5" marker-end="url(#arr)" /><text x="1322" y="195" class="small">STEP / DIR</text>
<path d="M1310 359H1394" fill="none" stroke="#344c62" stroke-width="2.5" marker-end="url(#arr)" /><text x="1325" y="346" class="small">STEP / DIR</text>
<path d="M1310 460H1394" fill="none" stroke="#344c62" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arrstart)"/><text x="1325" y="448" class="small">UART</text>
<path d="M1130 640V526" fill="none" stroke="#344c62" stroke-width="2.5" marker-end="url(#arr)" /><text x="1150" y="603" class="label">4 GPIO inputs</text>
<text x="1525" y="560" class="small" text-anchor="middle">Drivers connect to motors</text><text x="840" y="825" class="small" text-anchor="middle">Control arrows indicate command flow; double arrows indicate bidirectional communication.</text></svg>