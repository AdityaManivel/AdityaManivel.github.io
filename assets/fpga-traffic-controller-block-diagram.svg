<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">FPGA Traffic Controller System Block Diagram</title><desc id="desc">50 MHz FPGA clock through divider and timer into an eight-state traffic controller. Switches for reset and north and south turn requests. Outputs to traffic LEDs, turn indicators, and HEX0 display.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#23374b}.heading{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#4b6175}.box{fill:#f4f8fd;stroke:#83a9c8;stroke-width:2}.input{fill:#eef8f4;stroke:#70aa96;stroke-width:2}.output{fill:#fff6e9;stroke:#d9ac6e;stroke-width:2}.line{fill:none;stroke:#50789a;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#50789a"/></marker></defs><rect width="960" height="600" rx="24" fill="#fff"/><text x="480" y="43" text-anchor="middle" class="heading">FPGA Traffic Controller — DE1-SoC</text><rect x="45" y="88" width="238" height="87" rx="12" class="box"/><text x="164" y="122" text-anchor="middle" class="heading">50 MHz Clock</text><text x="164" y="151" text-anchor="middle" class="small">FPGA input clock</text><path d="M283 132H349" class="line"/><rect x="350" y="88" width="258" height="87" rx="12" class="box"/><text x="479" y="120" text-anchor="middle" class="heading">Clock Divider</text><text x="479" y="148" text-anchor="middle" class="small">Timing / counter logic</text><path d="M479 175V229" class="line"/><rect x="317" y="230" width="325" height="183" rx="16" class="box"/><text x="479" y="265" text-anchor="middle" class="heading">Traffic Controller</text><text x="479" y="298" text-anchor="middle" class="body">8-State FSM + Timer</text><text x="479" y="328" text-anchor="middle" class="small">4 through-traffic phases</text><text x="479" y="354" text-anchor="middle" class="small">4 protected turn phases</text><text x="479" y="383" text-anchor="middle" class="small">State transitions + output logic</text><rect x="40" y="234" width="233" height="162" rx="13" class="input"/><text x="156" y="269" text-anchor="middle" class="heading">Switch Inputs</text><text x="156" y="305" text-anchor="middle" class="body">SW9: Reset</text><text x="156" y="335" text-anchor="middle" class="body">SW0: South turn</text><text x="156" y="365" text-anchor="middle" class="body">SW1: North turn</text><path d="M273 316H316" class="line"/><rect x="704" y="225" width="222" height="97" rx="13" class="output"/><text x="815" y="260" text-anchor="middle" class="heading">Traffic LEDs</text><text x="815" y="290" text-anchor="middle" class="small">LEDR[5:0] · R/Y/G</text><path d="M642 273H703" class="line"/><rect x="704" y="338" width="222" height="89" rx="13" class="output"/><text x="815" y="373" text-anchor="middle" class="heading">Turn Indicators</text><text x="815" y="403" text-anchor="middle" class="small">LEDR[7:6] · Blink</text><path d="M642 382H703" class="line"/><path d="M479 413V468" class="line"/><rect x="350" y="469" width="258" height="89" rx="13" class="output"/><text x="479" y="506" text-anchor="middle" class="heading">HEX0 Display</text><text x="479" y="535" text-anchor="middle" class="small">Current FSM state (0–7)</text></svg>