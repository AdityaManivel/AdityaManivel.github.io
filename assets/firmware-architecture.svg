<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="t d"><title id="t">Firmware and software communication architecture</title><desc id="d">Browser connects by Wi-Fi HTTP to Linux Cortex-A7 web server, which communicates over RPMsg to Cortex-M4 UART relay, then to the separate STM32G473 PCB controller and motors. Camera streams through Linux GStreamer.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#53677f" stroke-width="1.4"/></marker></defs><rect width="1120" height="440" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#1c3049"><text x="40" y="44" font-size="24" font-weight="700">Firmware &amp; Software Architecture</text><text x="40" y="70" font-size="14" fill="#62748a">STM32MP157D-DK1 Linux board + separate STM32G473 PCB</text></g><g stroke="#b9c9d9" stroke-width="2" fill="white"><rect x="35" y="170" width="180" height="125" rx="14"/><rect x="275" y="103" width="390" height="254" rx="18" fill="#edf4fb"/><rect x="301" y="153" width="160" height="132" rx="12"/><rect x="480" y="153" width="160" height="132" rx="12"/><rect x="733" y="170" width="175" height="125" rx="14"/><rect x="960" y="170" width="125" height="125" rx="14"/><rect x="301" y="13" width="160" height="67" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#1c3049"><text x="125" y="218" font-size="19" font-weight="700">Browser</text><text x="125" y="245" font-size="13">HTML / CSS / JS</text><text x="470" y="127" font-size="18" font-weight="700">STM32MP157D-DK1</text><text x="381" y="190" font-size="16" font-weight="700">Cortex-A7</text><text x="381" y="212" font-size="13">Embedded Linux</text><text x="381" y="232" font-size="13">Python HTTP API</text><text x="381" y="252" font-size="13">GStreamer / MJPEG</text><text x="560" y="190" font-size="16" font-weight="700">Cortex-M4</text><text x="560" y="212" font-size="13">Bare-metal firmware</text><text x="560" y="232" font-size="13">RPMsg ↔ UART7</text><text x="560" y="252" font-size="13">Byte relay</text><text x="820" y="208" font-size="17" font-weight="700">STM32G473</text><text x="820" y="230" font-size="13">PCB firmware</text><text x="820" y="251" font-size="13">Command parsing</text><text x="1022" y="211" font-size="16" font-weight="700">Motors</text><text x="1022" y="235" font-size="13">Motor drivers</text><text x="381" y="41" font-size="17" font-weight="700">Camera</text><text x="381" y="60" font-size="12">V4L2 / GStreamer</text></g><g fill="none" stroke="#53677f" stroke-width="2.5" marker-end="url(#a)"><path d="M215 232 H300"/><path d="M461 219 H479"/><path d="M640 219 H732"/><path d="M908 232 H959"/><path d="M381 80 V152"/></g><g font-family="Arial,sans-serif" fill="#53677f" text-anchor="middle" font-size="12"><text x="257" y="201">HTTP / Wi-Fi</text><text x="470" y="310">OpenAMP / RPMsg</text><text x="687" y="201">UART7</text><text x="933" y="201">PWM / control</text><text x="470" y="336">Shared-memory IPC + IPCC notifications</text><text x="820" y="316">Independent physical PCB</text></g><text x="40" y="403" font-family="Arial,sans-serif" font-size="13" fill="#62748a">Boot automation: shell scripts + systemd • Z-axis servo: MODBUS RTU with CRC16</text></svg>