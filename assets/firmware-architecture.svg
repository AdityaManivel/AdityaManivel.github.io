<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Firmware communication block diagram</title><desc id="desc">Sketch-style diagram showing a laptop browser connected by Wi-Fi HTTP to a Linux web server on the STM32MP157D board. A camera feeds the web server. Linux communicates using OpenAMP RPMsg with the board's Cortex-M4, which relays UART commands to the separate STM32G473 PCB microcontroller. The PCB controls motor drivers and motors.</desc>
